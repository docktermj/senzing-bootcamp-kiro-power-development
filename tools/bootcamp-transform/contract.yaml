  # Development-status notes carried over from the template's own port, and dropped
  # (R12 AC2).
  #
  # ⛔ THESE READ AS A PROMISE IN THIS REPOSITORY, WHICH IS WHY THEY CANNOT SIMPLY BE
  # RE-WORDED. Release 0.5.1's skills carry roughly forty asides of the shape "the Kiro
  # `X.py` helper is a later porting phase; for now, do Y" — written when the template
  # was itself being ported FROM a Kiro-steering original, so "Kiro" there names the
  # thing being ported *from*. In the Bootcamp_Power "Kiro" names the host the
  # Bootcamper is sitting in and this Power is the artifact, so the same sentence reads
  # as a reference to a helper that is present, or arriving. Neither is true: no such
  # helper is bundled and none is planned here.
  #
  # Every entry keeps the instruction that was already beside the aside — the "do Y"
  # half is the part that works — and replaces only the status claim with a plain
  # statement that nothing is bundled. Where the aside named the absent helper, the
  # replacement still names it, so a reader who goes looking learns it is absent rather
  # than finding nothing at all.
  #
  # Two entries are the same defect in a different register: a "Reconciliation notes
  # (Kiro Power -> Claude plugin)" heading and a "Reconciliation note: the Kiro source
  # referred to X as if they were callable tools" aside are both port bookkeeping. They
  # become an operating note and a plain ⛔ warning respectively, because what they
  # protect — do not treat those names as MCP tools — is real and outlives the port.
  port-status:
    - find: |2
        (A full preflight script is a later porting phase; keep this check lightweight for now.)
      replace: |2
        (There is no preflight script; keep this check lightweight.)
      literal: true
    - find: |2
           returns nothing, continue to step 2.
        2. Present the matching pitfall/fix for this module (full `common-pitfalls` reference is a
           later porting phase; for now, use `search_docs` to look up the symptom).
      replace: |2
           returns nothing, continue to step 2.
        2. Present the matching pitfall/fix for this module. There is no bundled `common-pitfalls`
           reference, so use `search_docs` to look up the symptom.
      literal: true
    - find: |2
        (The full pattern gallery is a
        later porting phase; that is why this step retrieves rather than reads from a shipped catalogue.)
