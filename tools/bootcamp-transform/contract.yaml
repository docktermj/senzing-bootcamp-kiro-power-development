    - { find: "plugins", replace: "plugins", literal: true }
    - { find: "plugin.json", replace: "plugin.json", literal: true }
    - { find: "plugin_version", replace: "plugin_version", literal: true }
    - { find: "plugin.schema.json", replace: "plugin.schema.json", literal: true }
    - { find: "Plugin version", replace: "Plugin version", literal: true }
    - { find: "plugin version", replace: "plugin version", literal: true }
    - { find: "plugin manifest", replace: "plugin manifest", literal: true }
    - { find: "Senzing Bootcamp Plugin Feedback", replace: "Senzing Bootcamp Plugin Feedback", literal: true }
    - { find: "Template_Plugin", replace: "Template_Plugin", literal: true }
    - { find: "Plugin-owned", replace: "Plugin-owned", literal: true }
    - { find: "Plugin initialization error", replace: "Plugin initialization error", literal: true }
    - { find: "`plugin`", replace: "`plugin`", literal: true }
    - { find: "**plugin**", replace: "**plugin**", literal: true }
