    - find: "at claude.ai/code. "
      replace: "in a browser. "
      literal: true
    - find: |2-
        Claude
          Code plugin", "Kiro hooks" — and wrong as a way of saying *the terminal*, because Claude
          Desktop 
      replace: |2-
        Kiro
          Power", "Kiro hooks" — and wrong as a way of saying *the terminal*, because the desktop
