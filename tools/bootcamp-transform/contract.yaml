  # The artifact's own name, in prose (R12 AC2).
  #
  # The template calls itself a plugin throughout. Under Kiro it is a Power, and a
  # Bootcamper reading "the plugin's write-gate" or "two plugin roots on one machine" is
  # being told about something that, by that name, is not installed.
  #
  # THE SET IS THREE LAYERS, IN THIS ORDER, AND THE ORDER IS THE MECHANISM. A set is
  # applied as ONE left-to-right pass in which the earliest match wins and ties go to
  # the earlier-declared entry, and nothing rescans what a replacement emitted. So an
  # entry that matches a span and returns it UNCHANGED consumes that span, and every
  # later entry — including a general one — never sees it:
  #
  #   1. IDENTITY ENTRIES, one per span the rename must not claim. These are the
  #      occurrences that are IDENTIFIERS OR DATA VALUES rather than prose, where
  #      renaming breaks a contract with something that reads them:
  #
  #        `plugins`                      the plural is `agent-plugins.org` and the
  #                                       template's own `plugins/senzing-bootcamp`
  #                                       path; it is also a substring of the singular,
  #                                       so without this it becomes "Powers".
  #        `plugin.json`, `plugin_version`, `plugin.schema.json`
  #                                       the Agent Plugins manifest name, the ported
  #                                       function that resolves it, and its schema.
  #        `Plugin version`, `plugin version`
  #                                       a recap/keepsake FIELD LABEL and its prose
  #                                       form. `generate_recap_pdf.py` matches the
  #                                       label case-insensitively to render the
  #                                       certificate and `module-completion.md` amends
  #                                       it in place; rename it and the renderer stops
  #                                       finding it.
  #        `plugin manifest`              names the manifest, so it follows the filename.
  #        `Senzing Bootcamp Plugin Feedback`, `SENZING_BOOTCAMP_PLUGIN_FEEDBACK`
  #                                       the feedback document's header and committed
  #                                       filename.
  #        `Template_Plugin`              the design's term for the upstream artifact,
  #                                       which IS a plugin.
  #        `Plugin-owned`                 upstream writes the capitalized form once, in a
  #                                       heading the Power keeps as-is.
  #        `Plugin initialization error`  Senzing's own SENZ2027 error text, quoted from
  #                                       `explain_error_code`. Rewriting a quoted engine
  #                                       message makes it unfindable.
  #        `plugin`, `**plugin**`, `plugin issue`, `[plugin | mcp-server`
  #                                       the feedback report's triage VERDICT — one of
  #                                       five values of its Routing field — in each
  #                                       spelling the corpus uses.
  #        `bootcamp|plugin`, `bootcamp, plugin, module or tutorial`,
  #        `bootcamp/plugin referent`, `plugin, so record it as given`
  #                                       `feedback-capture.py`'s `_OURS` pattern and the
  #                                       comments that explain it: the pattern matches
  #                                       what a BOOTCAMPER types, and they type
  #                                       "plugin".
  #
  #   2. PASSAGE ENTRIES, for spans where the sentence changes and not just the noun,
  #      written in the PRE-rename spelling so they are matched ahead of layer 3.
  #
  #   3. THE GENERAL RENAME, last, claiming every occurrence the first two layers left.
  #      It is general on purpose: prose the next Template_Release adds should be
  #      renamed without a contract edit, and the exceptions above are identifiers,
  #      which is a closed and stable set. A new identifier-shaped use of the word is
  #      the one thing this cannot see, and it is what a Maintainer reviews when the
  #      Update_Skill reports this file as changed.
  #
  # Declared LAST on every rule that takes it, so the passage sets above match the
  # template's own wording rather than a half-renamed version of it.
    - find: |2
        module/step. (Full session-resume behavior is a later porting
             phase; for now, read `current_module`/`current_step` and continue from there.)
      replace: |2
        module/step: read `current_module`/`current_step` and
             continue from there.
      literal: true
    - find: |2-
        the full `common-pitfalls` reference is a later porting
           phase; for now use 
      replace: |2-
        there is no bundled `common-pitfalls` reference, so use
           
      literal: true
    - find: |2
        fix (the full
           `common-pitfalls` reference and its Troubleshooting-by-Symptom table are a later porting
           phase).
      replace: |2
        fix. There is no bundled
           `common-pitfalls` reference or Troubleshooting-by-Symptom table.
      literal: true
