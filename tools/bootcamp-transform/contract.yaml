  # --- Ported scripts (R10) ------------------------------------------------
  # Every ported script lands together under ONE owning skill's scripts/ directory, so
  # the same-directory Python module imports between them (`import recap_checkpoint`,
  # `import docker_lifecycle`) keep resolving (R10 AC1). File names and the relative
  # sub-structure below `scripts/` are preserved byte-identically.
  #
  # `client-names` is declared here because a ported script's docstrings and its
  # messages address the client by name — `feedback-capture.py` explains that the
  # host substitutes `${CLAUDE_PLUGIN_ROOT}` in a hook's `args`, `write-gate.py`
  # names the sessions its guard protects, `stop-nudge.py` names whose turn limit it
  # re-fired against. A Bootcamper reads those strings, so they are ported prose in a
  # `.py` file and R12 AC2 applies to them exactly as it does to a `.md` file.
  - id: scripts-owned
    kind: substitute
    source: "scripts/**/*.py"
    exclude: ["scripts/vendor/**"]
    dest: "skills/bootcamp-onboarding/scripts/"
    substitutions:
      [
        plugin-root,
        manifest-path,
        client-names,
        tool-names,
        feedback-filename,
        script-paths-root,
        surface-naming,
        kiro-mechanisms,
        port-status,
        power-vocabulary,
      ]

  # Vendored third-party assets, byte-for-byte at the same relative location
  # (R10 AC3). Declared as `copy`, never `substitute`: a single rewritten byte in
  # `d3.v7.min.js` is a corrupted dependency.
  - id: scripts-vendor
    kind: copy
    source: "scripts/vendor/**"
    dest: "skills/bootcamp-onboarding/scripts/vendor/"

  # Non-Python assets that sit beside the scripts and are loaded by them (for example
  # `senzing_logo_light.png`). Byte-for-byte, same relative location (R10 AC3).
  - id: scripts-assets
    kind: copy
    source: "scripts/**"
    exclude: ["scripts/**/*.py", "scripts/vendor/**"]
    dest: "skills/bootcamp-onboarding/scripts/"

  # --- Ported documentation (R12) -----------------------------------------
  # `docs/model-selection.md` is excluded and superseded — see the
  # `model-selection-superseded` and `model-selection-doc` rules below.
  - id: docs
    kind: substitute
    source: "docs/**/*.md"
    exclude: ["docs/model-selection.md"]
    dest: "docs/"
    substitutions: [client-names, model-guidance]

  # Documentation examples and reference assets — PNG screenshots, the example recap
  # PDF, the truth-set visualization images — are ported as embedded assets, byte-for-
  # byte, so every reference from a ported document still resolves (R12 AC1).
  - id: docs-assets
    kind: copy
    source: "docs/**"
    exclude: ["docs/**/*.md", "docs/examples/bootcamp_recap.example.pdf"]
    dest: "docs/"

  # --- The one documentation asset a byte-for-byte copy gets wrong -----------
  # `bootcamp_recap.example.pdf` is the worked example of the keepsake a Bootcamper
  # finishes with: `generate_recap_pdf.py` rendered from
  # `bootcamp_recap.example.md`, which ports by substitution and is byte-identical
  # to it. The PDF is not, and cannot be, because a PDF is not the document — it is
  # a RENDERING of the document by a renderer this build also ports. That renderer's
  # cover and footer name the artifact, and `power-vocabulary` correctly rewrites
  # "Claude plugin" to "Kiro Power" in the ported `generate_recap_pdf.py`. Copying
  # the template's PDF therefore ships an example whose visible text disagrees with
  # the renderer that is supposed to have produced it, and it says "Claude plugin"
  # to every Bootcamper who opens the sample of their own certificate.
  #
  # This is exactly the failure a digest check cannot see: the PDF's hash matches
  # its source perfectly, and the content inside is stale. So the rendered artifact
  # is declared `kiro-owned` and carried as authored bytes, produced by running the
  # ported renderer over the ported example document.
  #
  # WHEN THIS HAS TO BE REFRESHED: whenever a newer Template_Release changes
  # `bootcamp_recap.example.md`, or when a change here alters the renderer's output.
  # Re-render rather than hand-edit — the point of the file is that it is what the
  # shipped renderer produces:
  #
  #   python3 powers/senzing-bootcamp/skills/bootcamp-onboarding/scripts/generate_recap_pdf.py \
  #       --input  powers/senzing-bootcamp/docs/examples/bootcamp_recap.example.md \
  #       --output tools/bootcamp-transform/templates/kiro-owned/docs/examples/bootcamp_recap.example.pdf
  #
  # The example document itself stays ported: it is prose, it ports cleanly, and
  # freezing it would silently drop upstream improvements to the worked example.
  # The template's rendering is superseded by a rule rather than by an `ignore` entry,
  # for the same reason `model-selection.md` is: `ignore` is consulted on both sides,
  # so an entry naming this path would suppress the authored replacement too.
  - id: docs-recap-example-pdf-superseded
    kind: ignore
    source: "docs/examples/bootcamp_recap.example.pdf"

  - id: docs-recap-example-pdf
    kind: kiro-owned
    owner: kiro
    dest: "docs/examples/bootcamp_recap.example.pdf"

  # --- The one ported document whose SUBJECT is the host --------------------
  # `docs/model-selection.md` is maintainer notes recording which components of the
  # artifact can carry a model or reasoning-effort setting, what those settings scope
  # to, and a best-value model evaluation per skill. Every other ported document
  # describes the BOOTCAMP, which is the same bootcamp on either host and so ports by
  # substitution. This one describes the HOST, and the two hosts differ in kind:
  #
  #   * The template's analysis rests on per-skill `model:` / `effort:` frontmatter and
  #     on a `context: fork` escape hatch for sustained per-skill control. Kiro's skill
  #     frontmatter has NO model key, NO effort key, and no forked-skill equivalent.
  #   * An unrecognized frontmatter key in Kiro is a silent no-op, not an error. So a
  #     substituted version of this document would advise a setting that looks applied
  #     and does nothing — the worst available outcome for a document whose entire job
  #     is telling a Maintainer which dials exist.
  #   * The conclusions invert rather than reword. Where the template says the session
  #     lever is *more reliable* than per-skill frontmatter, Kiro's answer is that the
  #     session lever is the ONLY one, and therefore that everything the bootcamp does
  #     about model selection is a recommendation the Bootcamper acts on rather than a
  #     setting the Power applies.
  #
  # No substitution set can turn a document about keys that exist into a document
  # about keys that do not, so this is declared `kiro-owned` and authored, and the
  # template's version is superseded by a rule rather than by an `ignore` entry —
  # `ignore` is consulted on both sides, so an entry naming this path would suppress
  # the authored file as well as the template's.
  #
  # WHAT THIS COSTS, stated because it is a real cost: an upstream edit to the
  # per-skill evaluation or to the module-start recommendation table no longer arrives
  # by rebuild. The authored document carries the same tables, and a Maintainer moving
  # to a newer Template_Release should diff the template's copy against this one. The
  # Update_Skill's reconciliation reports the rule as a preserved adaptation, which is
  # where that review belongs.
  - id: model-selection-superseded
    kind: ignore
    source: "docs/model-selection.md"

  - id: model-selection-doc
    kind: kiro-owned
    owner: kiro
    dest: "docs/model-selection.md"

  # --- Generated Agent Plugins manifests (R4 AC1, AC2, AC3) ---------------
  # Each generate rule names the template document it supersedes, so the superseded
  # source is accounted for by a rule rather than reported as unmatched content.
  - id: manifest
    kind: generate
    source: ".claude-plugin/plugin.json"
    template: "templates/plugin.json.j2"
    dest: "plugin.json"

  # Translates the template's {"type": "http"} declaration into the Agent Plugins
  # streamable-http form and adds $schema (R11 AC1, AC2).
  - id: mcp
    kind: generate
    source: ".mcp.json"
    template: "templates/mcp.json.j2"
    dest: "mcp.json"

  # --- Deliberately not ported, with a rule rather than a bare path -------
  # The template's slash commands are thin wrappers around `bootcamp-onboarding`.
  # Kiro has no plugin-level slash commands, so each is represented instead by one
  # trigger-phrase skill materialized by the `command-skills` rule below (R9 AC1).
  # The command markdown itself is therefore matched and not ported; the
  # Schema_Validator still checks the one-to-one correspondence between this
  # command set and those skills.
  #
  # ⚠️ THIS GLOB IS WHY A NEW UPSTREAM COMMAND DOES NOT REPORT ITSELF AT BUILD
  # TIME. `commands/*.md` claims a command file this contract has never seen, so
  # `E_UNMATCHED_FILE` — the early warning for genuinely new upstream content —
  # cannot fire for one. The gate that does catch it is the Schema_Validator's
  # `skill-inventory` bijection, which reports `E_INVENTORY_MISMATCH`
  # (`template-command-unrepresented`) naming the command file. That is a later
  # and narrower signal than the unmatched-file halt, so when a release adds a
  # command the answer is a new `dest` on `command-skills` plus an authored skill
  # under `templates/kiro-owned/skills/`, exactly as release 0.5.3's
  # `bootcamp-note` and `package-bootcamp` were added. Narrowing this glob to an
  # enumerated list was considered and rejected: it would move the signal earlier
  # at the cost of a second place to declare every command, and the bijection
  # already names the missing one precisely.
  - id: commands-superseded
    kind: ignore
    source: "commands/*.md"

  # --- Kiro-owned content: no template source (R5 AC5) --------------------
  # Shipped hook JSON carries the <ABSOLUTE_PYTHON> and <ABSOLUTE_SCRIPTS_DIR>
  # placeholders only. The Hook_Installer resolves both to quoted absolute paths at
  # install time (R16 AC3, AC4); no substitution set ever writes an interpreter name.
  # Both destinations receive the same JSON: the skill asset directory is Tier 2, the
  # consented workspace install the Bootcamper actually runs (R7 AC5), and
  # `dev.kiro/hooks/` is Tier 3 forward compatibility — inert if Kiro ignores it, and
  # never the sole delivery path for any behavior (R7 AC12).
  #
  # THE TWO SETS BELOW ARE WHY THIS RULE DECLARES SUBSTITUTIONS AT ALL, and they are
  # the only reason a `kiro-owned` rule ever does. Both carry a value that depends on
  # an unverified assumption, so both must have exactly one home — this contract —
  # rather than being spelled into an authored asset that a Maintainer would then have
  # to hand-patch:
  #
  #   tool-names           the `PreToolUse` matcher (A3). The definitions are authored
  #                        in the template's tool vocabulary and rewritten here.
  #   scripts-dir-strategy how the installer resolves <ABSOLUTE_SCRIPTS_DIR> (A4). The
  #                        coverage map carries the placeholder; this fills it.
  #
  # Neither set can reach a Hook_Command_String: no set names <ABSOLUTE_PYTHON>,
  # <ABSOLUTE_SCRIPTS_DIR>, or any interpreter name, so the shipped commands are
  # materialized byte-for-byte as authored and stay unresolved until install time.
  - id: kiro-hooks
    kind: kiro-owned
    owner: kiro
    dest: ["skills/bootcamp-onboarding/assets/kiro-hooks/", "dev.kiro/hooks/"]
    substitutions: [tool-names, scripts-dir-strategy]

  # The command-derived skills: one per template command, each carrying exactly one
  # distinct trigger phrase (R9 AC1, AC2, AC3).
  #
  # ONE `dest` PER COMMAND THE RESOLVED RELEASE DECLARES, AND THE LIST IS NOT A
  # COUNT. `skill-inventory` checks a bijection against `commands/*.md` in the
  # resolved release, in both directions, so this list is wrong in a way that
  # blocks tagging if it drifts from that set either way: a command with no skill
  # is `template-command-unrepresented`, and a skill declaring a command the
  # release does not carry is `declares-absent-template-command`. That second
  # direction is why the list cannot simply accumulate — a `dest` is removed when
  # upstream removes the command it stands for.
  #
  # The template command name and the skill name are deliberately allowed to
  # differ: `graduate` is represented by `graduate-bootcamp`, so what ties the two
  # together is the `metadata.templateCommand` field in each authored skill's
  # frontmatter, never the directory name. The four names that happen to match
  # match by coincidence of good naming, not by rule.
  #
  # Release 0.5.3 added `bootcamp-note` and `package-bootcamp`; both are
  # Bootcamper-facing flows whose workflow documents (`notes.md`, `packaging.md`)
  # port into `bootcamp-onboarding` under the `skills-fixed` rule, so each authored
  # skill here is an entry point that hands off to a ported document, exactly as
  # the other three are.
  - id: command-skills
    kind: kiro-owned
    owner: kiro
    dest:
      - "skills/start-bootcamp/"
      - "skills/graduate-bootcamp/"
      - "skills/bootcamp-feedback/"
      - "skills/bootcamp-note/"
      - "skills/package-bootcamp/"

  # The client-adaptation skill that realizes the Hook_Installer (R7 AC6-AC11).
  - id: enforcement-setup-skill
    kind: kiro-owned
    owner: kiro
    dest: "skills/bootcamp-enforcement-setup/"

  # The Optional_Runtime guard (R16 AC7). Only the resolved Python interpreter is
  # required; every other runtime a ported script may want — a container CLI for the
  # SDK modules, a browser for the truth-set visualization screenshots — is optional,
  # and its absence reduces capability without failing, blocking a hook trigger, or
  # wedging a session.
  #
  # DECLARED HERE, NOT SUBSTITUTED IN. Release 0.5.1's ported scripts already degrade
  # this way: `docker_lifecycle.py` gates every container-CLI call on `shutil.which`
  # and warns-and-continues, the two hook scripts that import it (`session-start.py`,
  # `session-end.py`) exit 0 unconditionally, no hook script touches a browser at all,
  # and `capture_screenshots.py` — agent-invoked, never a hook — reports every location
  # it searched and says to keep the HTML link. Nothing needs rewriting, so no
  # substitution set touches a ported script body: a literal rewrite of an exit status
  # would be indiscriminate across the ported set, and `write-gate.py` MUST keep its
  # blocking exit 2 (R7 AC5). The guard therefore ships as `kiro-owned` content instead.
  #
  # `dest` is a FILE, not a directory, and deliberately so. A directory `dest` here
  # would make the whole ported script set Kiro-owned on the update path, where
  # `--carry-forward` is consulted before `templates/kiro-owned/`: the engine would
  # walk the existing Power's `scripts/` directory, claim every ported script as
  # authored content, and collide with the `scripts-owned` rule. A file `dest` claims
  # exactly this one module. It lands beside the ported scripts, so any of them reaches
  # it through the same-directory import that already joins them
  # (`import optional_runtime`) — no per-script patching, on any Supported_Platform.
  - id: optional-runtime-guard
    kind: kiro-owned
    owner: kiro
    dest: "skills/bootcamp-onboarding/scripts/optional_runtime.py"
